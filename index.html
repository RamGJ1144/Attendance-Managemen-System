<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
            background-image: url('p.webp');
            background-size: cover;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .form-box h2 {
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
            min-width: 200px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .add-btn {
            background: #16a34a;
        }

        .present-btn {
            background: #16a34a;
        }

        .absent-btn {
            background: #dc2626;
        }

        .delete-btn {
            background: #555;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .percentage {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #222;
            color: white;
        }

        
    </style>
</head>

<body>

<header>
    <h1>Attendance Management System</h1>
    <p>Student Attendance Tracking</p>
</header>

<div class="container">

    <!-- Add Student -->
    <div class="form-box">
        <h2>Add Student</h2>

        <div class="form-group">
            <input type="text" name="aaa" id="rollNumber" placeholder="Enter Roll Number">
            <input type="text" id="studentName" placeholder="Enter Student Name">
            <input type="text" id="course" placeholder="Enter Course">
            <button class="add-btn" onclick="addStudent()">
                Add Student
            </button>
        </div>
    </div>

    <!-- Summary -->
    <div class="summary">

        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="card">
            <h3>Present Today</h3>
            <p id="presentToday">0</p>
        </div>

        <div class="card">
            <h3>Absent Today</h3>
            <p id="absentToday">0</p>
        </div>

    </div>

    <!-- Search -->
    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Search student by name or roll number..."
            onkeyup="displayStudents()"
        >
    </div>

    <!-- Attendance Table -->
    <div class="table-box">

        <h2>Student Attendance</h2>

        <br>

        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Roll Number</th>
                    <th>Student Name</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Total Days</th>
                    <th>Attendance %</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

        <div id="emptyMessage" class="empty">
            No students added yet.
        </div>

    </div>

</div>

<footer>
    <p>© 2026 Attendance Management System</p>
</footer>


<script>

    // Get students from Local Storage
    let students = JSON.parse(localStorage.getItem("students")) || [];


    // Add Student
    function addStudent() {

        let rollNumber = document.getElementById("rollNumber").value.trim();
        let studentName = document.getElementById("studentName").value.trim();
       

        if (rollNumber === "" || studentName === "") {
            alert("Please enter Roll Number and Student Name.");
            return;
        }
   

        // Check duplicate roll number
        let existingStudent = students.find(
            student => student.rollNumber === rollNumber
        );

        if (existingStudent) {
            alert("This Roll Number already exists.");
            return;
        }

        let student = {
            // id: Date.now(),
            rollNumber: rollNumber,
            name: studentName,
            present: 0,
            absent: 0
        };

        students.push(student);

        saveData();
        displayStudents();

        document.getElementById("rollNumber").value = "";
        document.getElementById("studentName").value = "";
    }


    // Mark Present
    function markPresent(id) {

        let student = students.find(student => student.id === id);

        if (!student) {
            return;
        }

        student.present++;

        saveData();
        displayStudents();
    }


    // Mark Absent
    function markAbsent(id) {

        let student = students.find(student => student.id === id);

        if (!student) {
            return;
        }

        student.absent++;

        saveData();
        displayStudents();
    }


    // Delete Student
    function deleteStudent(id) {

        let confirmDelete = confirm(
            "Are you sure you want to delete this student?"
        );

        if (!confirmDelete) {
            return;
        }

        students = students.filter(
            student => student.id !== id
        );

        saveData();
        displayStudents();
    }


    // Save data
    function saveData() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );
    }


    // Display Students
    function displayStudents() {

        let table = document.getElementById("studentTable");
        let searchValue = document
            .getElementById("search")
            .value
            .toLowerCase();

        table.innerHTML = "";

        let filteredStudents = students.filter(student =>
            student.name.toLowerCase().includes(searchValue) ||
            student.rollNumber.toLowerCase().includes(searchValue)
        );

        if (filteredStudents.length === 0) {

            document.getElementById("emptyMessage").style.display = "block";

        } else {

            document.getElementById("emptyMessage").style.display = "none";
        }


        filteredStudents.forEach((student, index) => {

            let totalDays =
                student.present + student.absent;

            let percentage = 0;

            if (totalDays > 0) {

                percentage =
                    (student.present / totalDays) * 100;

            }

            let row = document.createElement("tr");

            row.innerHTML = `

                <td>${index + 1}</td>

                <td>${student.rollNumber}</td>

                <td>${student.name}</td>

                <td>
                    <button
                        class="present-btn"
                        onclick="markPresent(${student.id})">
                        Present
                    </button>
                    <br>
                    ${student.present}
                </td>

                <td>
                    <button
                        class="absent-btn"
                        onclick="markAbsent(${student.id})">
                        Absent
                    </button>
                    <br>
                    ${student.absent}
                </td>

                <td>${totalDays}</td>

                <td class="percentage">
                    ${percentage.toFixed(2)}%
                </td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${student.id})">
                        Delete
                    </button>
                </td>

            `;

            table.appendChild(row);

        });


        updateSummary();
    }


    // Update Summary
    function updateSummary() {

        document.getElementById("totalStudents").innerText =
            students.length;

        let present = 0;
        let absent = 0;

        students.forEach(student => {

            present += student.present;
            absent += student.absent;

        });

        document.getElementById("presentToday").innerText =
            present;

        document.getElementById("absentToday").innerText =
            absent;
    }


    // Display students when page loads
    displayStudents();

</script>

</body>
</html>
